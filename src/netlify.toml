# Netlify configuration for CR8 Solutions

[build]
  # Build command - adjust if needed based on your build setup
  command = "npm run build"
  # Directory to publish
  publish = "dist"
  # Ignore Supabase functions directory
  ignore = "supabase/**"

[build.environment]
  # Disable any Supabase integration
  SUPABASE_SKIP = "true"

# Redirect all requests to index.html for client-side routing (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
