<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CR8 Solutions - High-end marketing agency specializing in growth, turnover, and client acquisition. More growth, more turnover, more clients guaranteed." />
    <meta name="keywords" content="marketing agency, business growth, client acquisition, digital marketing, CR8 Solutions" />
    <title>CR8 Solutions - Marketing Agency | More Growth, More Turnover, More Clients</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Hidden forms for Netlify form detection -->
    <form name="booking" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="businessEmail" />
      <input type="text" name="countryCode" />
      <input type="text" name="phoneNumber" />
      <input type="text" name="website" />
      <input type="text" name="companyName" />
      <input type="text" name="canAfford" />
      <textarea name="currentProblem"></textarea>
      <input type="text" name="solveBy" />
    </form>
    
    <form name="newsletter" netlify netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
    </form>
    
    <script type="module" src="/App.tsx"></script>
  </body>
</html>
